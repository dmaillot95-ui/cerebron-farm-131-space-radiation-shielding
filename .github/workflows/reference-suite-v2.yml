name: F131 Scientific Suite
on:
  workflow_dispatch:
  push:
    paths: ['runtime/reference_suite_v2.py','.github/workflows/reference-suite-v2.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python runtime/reference_suite_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: f131-scientific-suite
          path: artifacts/f131_reference_suite.json
